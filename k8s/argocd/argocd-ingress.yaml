# https://argocd.jawsight.online (same NLB and ingress-nginx as the todo app).
# Needs a Namecheap CNAME "argocd" pointing to the NLB.
# The argocd CLI needs --grpc-web when it goes through here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  # must be in the same namespace as the argocd-server Service
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # argocd-server only serves HTTPS
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - argocd.jawsight.online
      secretName: argocd-ingress-tls
  rules:
    - host: argocd.jawsight.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: https
