# trust-manager Bundle: copies the logs Elasticsearch's CA certificate (public, harmless)
# from the Secret ECK keeps in "logging" into a ConfigMap "logs-es-ca" in "monitoring",
# so Grafana can verify the HTTPS certificate of https://logs-es-http.logging.svc:9200.
# Only the public CA is copied, never a password.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: logs-es-ca
spec:
  sources:
    - secret:
        name: logs-es-http-certs-public
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
