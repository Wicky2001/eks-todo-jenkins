# trust-manager copies the public CA of the logs Elasticsearch into a ConfigMap
# "logs-es-ca" in the monitoring namespace, so Grafana can verify the certificate.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: logs-es-ca
spec:
  sources:
    - secret:
        name: logs-es-http-certs-public
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
