apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: logging
spec:
  version: 9.5.0
  # Extra user besides "elastic": fluentbit-user, which may only write logs-* indices.
  # Both Secrets are created by Terraform (tf/infra/modules/logging/main.tf).
  auth:
    roles:
      - secretName: fluentbit-role
    fileRealm:
      - secretName: fluentbit-user
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: elasticsearch-sc
            resources:
              requests:
                storage: 20Gi
