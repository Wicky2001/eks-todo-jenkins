tolerations:
  - operator: Exists

env:
  - name: ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-es-elastic-user
        key: elastic

extraVolumes:
  - name: es-ca
    secret:
      secretName: elasticsearch-es-http-certs-public
extraVolumeMounts:
  - name: es-ca
    mountPath: /es-ca
    readOnly: true

config:
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host elasticsearch-es-http.logging.svc
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ES_PASSWORD}
        tls On
        tls.verify On
        tls.ca_file /es-ca/ca.crt
        Logstash_Format On
        Logstash_Prefix logs
        Suppress_Type_Name On
        Replace_Dots On
        Retry_Limit False
