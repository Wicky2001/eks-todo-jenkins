# Where Alertmanager sends the alerts that Prometheus fires (rules are in alert-rules.yml).
# Alertmanager does not watch the cluster itself; it only routes and sends.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: main-rules-alert-config
  namespace: monitoring
  # Alertmanager only loads configs with this label (see helm-values.yaml).
  labels:
    release: monitoring
spec:
  route:
    # Alerts that match nothing below are dropped.
    receiver: 'null'
    # Send a still-firing alert again every 30 minutes.
    repeatInterval: 30m
    routes:
    - matchers:
      - name: alertname
        value: HighCpuUsage
      receiver: 'send-email'

    - matchers:
      - name: alertname
        value: PodRestart
      receiver: 'send-email'
      # restarts are more urgent, so repeat every 5 minutes
      repeatInterval: 5m

  receivers:
  - name: 'send-email'
    emailConfigs:
    - to: "wickram-cs20035@stu.kln.ac.lk"
      from: "pmwickramaratna@gmail.com"
      # only email when something breaks, not when it recovers
      sendResolved: false
      smarthost: smtp.gmail.com:587
      authUsername: "pmwickramaratna@gmail.com"
      authIdentity: "pmwickramaratna@gmail.com"
      # Gmail app password, from the Secret mail-pass (not in git)
      authPassword:
        name: mail-pass
        key: gmail-pass

  - name: 'null'
