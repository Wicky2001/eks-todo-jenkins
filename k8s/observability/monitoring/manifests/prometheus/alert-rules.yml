# Alert rules for Prometheus (not Alertmanager).
# Prometheus checks these expressions all the time. When one is true for long enough,
# it sends the alert to Alertmanager, which emails it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-alert-rules
  namespace: monitoring
  # Prometheus only loads rules with this label (our Helm release is called "monitoring").
  labels:
    release: monitoring
spec:
  groups:
  - name: custom.rules
    rules:

    # CPU usage of a node above 50% for 5 minutes.
    # rate(...idle[2m]) = share of time each core was idle over the last 2 minutes (0.65 = 65% idle).
    # avg by(instance) averages the cores of one node, and 100 - idle% gives the usage%.
    # Example: 65% idle -> 35% used -> no alert. 20% idle -> 80% used -> alert.
    - alert: HighCpuUsage
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 50
      # Must stay high for 5 minutes, so short spikes don't send emails.
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage on instance {{ $labels.instance }}"
        description: "CPU usage is above 50% (current value: {{ $value }}%)"

    # A container has restarted more than twice. Fires straight away.
    - alert: PodRestart
      expr: kube_pod_container_status_restarts_total > 2
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "Pod restart detected in namespace {{ $labels.namespace }}"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times"
