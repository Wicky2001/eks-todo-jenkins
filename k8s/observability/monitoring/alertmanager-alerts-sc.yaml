# gp3 EBS disk type for Alertmanager (silences and notification history)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: alertmanager-alerts-sc
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  tagSpecification_1: "Name=alertmanager-alerts-ebs"
  tagSpecification_2: "Project=EKS-Todo"
  tagSpecification_3: "Component=Metrics"
