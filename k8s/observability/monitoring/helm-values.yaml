# Values for the kube-prometheus-stack chart (Prometheus, Alertmanager, Grafana).
# The storage classes used below come from the *-sc.yaml files next to this one. Terraform applies
# them before this chart, otherwise the disks would stay Pending.

grafana:
  # Admin login from the grafana-admin Secret (Terraform generates the password).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Public address, needed for links and login redirects.
  # The route itself is in grafana-route.yaml.
  grafana.ini:
    server:
      root_url: https://grafana.jawsight.online

  # Grafana shows metrics, logs and traces. Prometheus is added by the chart,
  # logs and traces are added below.
  envValueFrom:
    # password of grafana-user (read-only user in the logs Elasticsearch)
    ES_PASSWORD:
      secretKeyRef:
        name: grafana-es-credentials
        key: password
    # CA of the logs Elasticsearch, copied here by trust-manager (logs-es-ca-bundle.yaml)
    ES_CA:
      configMapKeyRef:
        name: logs-es-ca
        key: ca.crt

  additionalDataSources:
    # Logs written by Fluent Bit
    - name: Elasticsearch logs
      type: elasticsearch
      uid: elasticsearch-logs
      access: proxy
      url: https://logs-es-http.logging.svc:9200
      basicAuth: true
      basicAuthUser: grafana-user
      secureJsonData:
        basicAuthPassword: ${ES_PASSWORD}
        tlsCACert: ${ES_CA}
      jsonData:
        index: "logs-*"
        timeField: "@timestamp"
        logMessageField: log
        tlsAuthWithCACert: true

    # Traces. Grafana goes through Jaeger's API; the Jaeger UI itself stays private.
    - name: Jaeger
      type: jaeger
      uid: jaeger
      access: proxy
      url: http://jaeger.tracing.svc.cluster.local:16686
      jsonData:
        # "Logs for this span" opens the logs from 1 minute before to 1 minute after the span.
        tracesToLogsV2:
          datasourceUid: elasticsearch-logs
          spanStartTimeShift: "-1m"
          spanEndTimeShift: "1m"
          filterByTraceID: false
          filterBySpanID: false

  # Keep dashboards and users on an EBS disk, otherwise they are lost on every restart.
  persistence:
    enabled: true
    type: pvc
    storageClassName: grafana-sc
    accessModes: ["ReadWriteOnce"]
    size: 10Gi

  # The disk can only attach to one pod at a time, so stop the old pod before
  # starting the new one (RollingUpdate would fail with a Multi-Attach error).
  deploymentStrategy:
    type: Recreate

alertmanager:
  alertmanagerSpec:
    # Load AlertmanagerConfig objects with this label, from any namespace.
    alertmanagerConfigSelector:
      matchLabels:
        release: monitoring
    alertmanagerConfigMatcherStrategy:
      type: None

    replicas: 1

    # Disk for silences and notification history.
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: alertmanager-alerts-sc
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

prometheus:
  prometheusSpec:
    # Only pick up ServiceMonitors and rules with this label.
    serviceMonitorSelector:
      matchLabels:
        release: monitoring
    ruleSelector:
      matchLabels:
        release: monitoring

    # Disk for the metrics (TSDB), so history survives restarts.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: prometheus-metrics-sc
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
