# gp3 EBS disk type for Grafana (dashboards and users)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: grafana-sc
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  tagSpecification_1: "Name=grafana-ebs"
  tagSpecification_2: "Project=EKS-Todo"
  tagSpecification_3: "Component=Dashboards"
