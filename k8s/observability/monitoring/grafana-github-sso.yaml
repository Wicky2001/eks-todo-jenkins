# Log in to Grafana with GitHub. Helm merges this on top of helm-values.yaml.
# Terraform fills in the org name and client ID. Kept separate because
# helm-values.yaml has placeholders that Grafana fills in, not Terraform.
#
# Callback URL for the GitHub OAuth App: https://grafana.jawsight.online/login/github
# (built from root_url in helm-values.yaml)

grafana:
  # client secret from the grafana-github-oauth Secret (created by Terraform)
  envValueFrom:
    GF_AUTH_GITHUB_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-github-oauth
        key: client-secret

  grafana.ini:
    auth.github:
      enabled: true
      allow_sign_up: true
      client_id: ${client_id}
      scopes: user:email,read:org
      # only members of this org can log in
      allowed_organizations: ${github_org}
      # GitHub teams come in as "@<org>/<team>". platform = Admin, developers = Viewer.
      role_attribute_path: "contains(groups[*], '@${github_org}/platform') && 'Admin' || contains(groups[*], '@${github_org}/developers') && 'Viewer'"
      # in the org but in neither team = can't log in
      role_attribute_strict: true
