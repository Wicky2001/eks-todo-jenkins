# https://grafana.jawsight.online. Grafana itself serves plain HTTP inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  # must be in the same namespace as the Grafana Service
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.jawsight.online
      secretName: grafana-ingress-tls
  rules:
    - host: grafana.jawsight.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # <helm release name>-grafana
                name: monitoring-grafana
                port:
                  number: 80
