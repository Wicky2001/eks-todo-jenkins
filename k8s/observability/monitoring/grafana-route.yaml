# https://grafana.jawsight.online, through main-gateway (HTTPS ends at the gateway).
# Grafana itself serves plain HTTP inside the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  # next to the Grafana Service
  namespace: monitoring
spec:
  parentRefs:
    - name: main-gateway
      namespace: istio-ingress
      sectionName: grafana-https
  hostnames:
    - grafana.jawsight.online
  rules:
    - backendRefs:
        # <helm release name>-grafana
        - name: monitoring-grafana
          port: 80
