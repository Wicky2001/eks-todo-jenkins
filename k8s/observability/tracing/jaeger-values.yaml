# Jaeger v2 values. Jaeger v2 is built on the OpenTelemetry Collector, so the config uses
# its layout: receivers -> processors -> exporters, plus extensions.
# Apps send spans to port 4318 (OTLP); the UI and Grafana query port 16686.

jaeger:
  # jaeger-user's password (Secret made by Terraform), used below as ${env:ES_PASSWORD}
  extraEnv:
    - name: ES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: jaeger-user
          key: password
  # CA of the traces Elasticsearch, to verify its certificate
  extraVolumes:
    - name: es-ca
      secret:
        secretName: traces-es-http-certs-public
  extraVolumeMounts:
    - name: es-ca
      mountPath: /es-ca
      readOnly: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

userconfig:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    jaeger_storage_exporter:
      trace_storage: primary_store

  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
    jaeger_query:
      storage:
        traces: primary_store
    jaeger_storage:
      backends:
        primary_store:
          elasticsearch:
            server_urls: ["https://traces-es-http.tracing.svc:9200"]
            tls:
              ca_file: /es-ca/ca.crt
            auth:
              basic:
                username: jaeger-user
                password: ${env:ES_PASSWORD}

  service:
    extensions: [healthcheckv2, jaeger_query, jaeger_storage]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter]
