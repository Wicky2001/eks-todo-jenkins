# Elasticsearch for traces only (logs have their own). ECK creates, in this namespace:
#   traces-es-http               Service, port 9200 (HTTPS)
#   traces-es-elastic-user       password of the elastic superuser
#   traces-es-http-certs-public  CA certificate, used by Jaeger to verify the connection
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: traces
  namespace: tracing
spec:
  version: 9.5.0
  # jaeger-user (only jaeger-* indices). Secrets come from tf/infra/modules/tracing.
  auth:
    roles:
      - secretName: jaeger-role
    fileRealm:
      - secretName: jaeger-user
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        metadata:
          labels:
            # The tracing namespace is in the Istio mesh, but this pod stays out:
            # Elasticsearch already does its own TLS, and Jaeger logs in with
            # jaeger-user. The mesh would only encrypt it a second time.
            istio.io/dataplane-mode: none
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            # created by the logging module
            storageClassName: elasticsearch-sc
            resources:
              requests:
                storage: 10Gi
