apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-db
  namespace: app
  annotations:
    # A Job's pod template is immutable, so a new image tag can't be applied
    # in place. This tells Argo CD to delete and recreate the Job instead.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: "078238935484.dkr.ecr.ap-south-1.amazonaws.com/eks-todo-migration:46fcca4169d6b9c5f27eab48b75dec20f81ba7e6"
          envFrom:
            - secretRef:
                name: backend-secret
