apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: app
  annotations:
    # Wave 0: updated only after the migration Job (wave -1) is Complete.
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend # label by which pod can be selected
    spec:
      containers:
        - name: frontend-container
          ports:
            - containerPort: 8080
          image: 677501681528.dkr.ecr.us-east-1.amazonaws.com/eks-todo-frontend:ca356732a982c7e1936b43ead923094ec8f4d71d
          imagePullPolicy: Always
