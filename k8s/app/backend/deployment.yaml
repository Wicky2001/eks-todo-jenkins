apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: app
  annotations:
    # Wave 0: updated only after the migration Job (wave -1) is Complete.
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend-container
          image: 677501681528.dkr.ecr.us-east-1.amazonaws.com/eks-todo-backend:6a0fd9b42bea4a1c7c5110073abd92235f67d9f3
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: backend-config-map
            - configMapRef:
                name: backend-db-config


