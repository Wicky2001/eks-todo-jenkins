# The connection to the secret vault. ESO only reads it when an ExternalSecret points to it
# (secretStoreRef.name: aws-secrets-manager). "Cluster" = ExternalSecrets in any namespace
# may use it. Terraform fills in the region.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${region}
      # No login settings here: ESO uses its own pod's AWS keys, which it gets
      # through Pod Identity (see tf/infra/modules/secrets).
