# Sends every http:// request to https:// (301).
# The Gateway only opens port 80. This route says what to do with requests there.
#
# Attached to: main-gateway (same namespace), listener "http" (port 80).
#
# While a certificate is being issued, cert-manager adds a second, temporary route on
# the same listener for one exact path: /.well-known/acme-challenge/<token>.
# An exact path is more specific than "/", so Let's Encrypt gets its answer there,
# and every other request still gets redirected by this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: istio-ingress
spec:
  parentRefs:
    - name: main-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
