apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Which EC2 types Karpenter may start.
      requirements:
        # c = compute-optimised family (c5, c6i, c7i, ...)
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c"]

        # small sizes only, so it never picks an expensive large instance
        - key: "karpenter.k8s.aws/instance-cpu"
          operator: In
          values: ["1", "2"]

        # skip the oldest (generation 1) hardware
        - key: "karpenter.k8s.aws/instance-generation"
          operator: Gte
          values: ["2"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

  # Upper limit of CPUs across all nodes of this pool.
  limits:
    cpu: 1000

  # Remove a node 30 seconds after its last pod leaves.
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
