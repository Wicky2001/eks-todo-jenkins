worker_processes 1;
# This is the file where nginx write it's master process ID.
# default place is /var/run where only root user allowd to do write operations
# since this container run as non root user we choose a location where non root user can do writes
pid /tmp/nginx.pid;


# increase the number of connection that can be handled by one worker process
# default is 512
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;


    # Define the format of each access log entry (custom name: access_log_format)
    log_format access_log_format '$http_x_forwarded_for "$request" $status $body_bytes_sent "$http_user_agent"';
    # Write access logs to stdout using the format defined above (no severity level)
    access_log /dev/stdout access_log_format;
    # Write error messages to stderr, including warnings and more serious errors
    error_log /dev/stderr warn;

    # When this is turned on nginx directly copy file to network request
    # when turned off file first go to buffer then to network connection
    sendfile on;
    # Help send HTTP response headers and file data together in larger pieces.
    tcp_nopush on;
    # Hide the Nginx version number from response headers and error pages.
    server_tokens off;
    
    keepalive_timeout 70;

    # Enable Gzip compression to reduce the size of responses sent to browsers.
    gzip on;
    # Compress only response bodies that are at least 256 bytes long.
    gzip_min_length 256;
    # Compress CSS, JavaScript, JSON, and SVG responses when eligible.
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Tell caches that responses may differ depending on the browser's compression support.
    gzip_vary on;


    server {
        listen 8080;
        root   /usr/share/nginx/html;
        index  index.html;

        # Health check for the Kubernetes readiness and liveness probes
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        
        location /assets/ {
            add_header Cache-Control "max-age=31536000";
        }

        # index.html must never be cached, or users keep running the old app
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # React routing: any unknown path returns index.html
        # when first we type www.todo.com this is the block catch that request and internelly -
        # -  redirect that to location = /index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}